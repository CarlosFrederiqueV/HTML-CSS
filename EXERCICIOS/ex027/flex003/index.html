<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criando Flexbox</title>
    <style>
        div.conteiner{
            background-color: lightblue;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap-reverse
        }

        div.item{
            background-color: lightgray;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco a</div>
        <div class="item">Exemplo de bloco b</div>
        <div class="item">Exemplo de bloco c</div>
        <div class="item">Exemplo de bloco d</div>
        <div class="item">Exemplo de bloco e</div>
        <div class="item">Exemplo de bloco f</div>
        <div class="item">Exemplo de bloco g</div>
        <div class="item">Exemplo de bloco h</div>
        <div class="item">Exemplo de bloco i</div>
    </div>
</body>
</html>
