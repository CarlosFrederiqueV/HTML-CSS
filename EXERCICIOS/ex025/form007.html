<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php">
        <p>
            <label for="iest"></label>
            <select name="estado" id="iest">
            <option value="Mg">Minas Gerais</option>
            <option value="Rj">Rio De Janeiro</option>
            <option value="Sp">São Paulo</option>
            </select>
        </p>
        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="iprof" id="Profissão" list="lstprof">
            <datalist id="lstprof">
                <option value="ADV">Advogado</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="Cont">Contador</option>
            </datalist>
        </p>
        <p>
            <label for="imensagem">Mensagem:</label> <br>
            <textarea name="Mensagem" id="imensagem"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
